name: live-quality

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

concurrency:
  group: live-quality-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-latest
    outputs:
      cloud_matrix: ${{ steps.matrix.outputs.cloud }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install --upgrade pip build
      - run: python -m pip install .
      - name: Derive cloud matrix from canonical registry
        id: matrix
        run: echo "cloud=$(python scripts/print_live_matrix.py --profile cloud)" >> "$GITHUB_OUTPUT"
      - run: python -m build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-candidate
          path: dist/*
          if-no-files-found: error

  cloud-live:
    needs: candidate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.candidate.outputs.cloud_matrix) }}
    env:
      RUN_LIVE: ${{ contains(fromJSON(vars.LIVE_PROVIDERS || '[]'), matrix.provider) }}
      PROVIDER: ${{ matrix.provider }}
      FRAMEWORK: ${{ matrix.framework }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
      AWS_BEARER_TOKEN_BEDROCK: ${{ secrets.AWS_BEARER_TOKEN_BEDROCK }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_DEFAULT_REGION: ${{ vars.AWS_REGION }}
      BEDROCK_MODEL_ID: ${{ vars.BEDROCK_MODEL_ID }}
    steps:
      - name: Record disabled provider explicitly (not a live pass)
        if: env.RUN_LIVE != 'true'
        run: |
          printf '{"schema_version":"agentic_systems.ci-live-status.v1","provider":"%s","framework":"%s","status":"not-run","reason":"Provider not enabled in LIVE_PROVIDERS"}\n' "$PROVIDER" "$FRAMEWORK" > "live-$PROVIDER-$FRAMEWORK.json"
          echo "Not run: $PROVIDER x $FRAMEWORK (LIVE_PROVIDERS)" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@v5
        if: env.RUN_LIVE == 'true'
      - uses: actions/setup-python@v6
        if: env.RUN_LIVE == 'true'
        with:
          python-version: "3.14"
          cache: pip
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        if: env.RUN_LIVE == 'true'
        with:
          name: release-candidate
          path: dist
      - if: env.RUN_LIVE == 'true'
        run: >-
          python -m pip install dist/*.whl
          "boto3>=1.39" "botocore>=1.39" "openai>=2.45,<3"
          "openai-agents>=0.18.3,<0.19" "langgraph>=0.2"
          "strands-agents>=1.29,<2" "mcp>=1,<2"
      - if: env.RUN_LIVE == 'true'
        run: >-
          python scripts/run_live_matrix.py
          --wheel $(ls dist/*.whl)
          --output live-${{ matrix.provider }}-${{ matrix.framework }}.json
          --providers ${{ matrix.provider }}
          --frameworks ${{ matrix.framework }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: live-${{ matrix.provider }}-${{ matrix.framework }}
          path: live-*.json
          if-no-files-found: warn

  ollama-live:
    if: contains(fromJSON(vars.LIVE_PROVIDERS || '[]'), 'ollama-runtime')
    needs: candidate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OLLAMA_MODEL: ${{ vars.OLLAMA_MODEL }}
      OLLAMA_BASE_URL: http://127.0.0.1:11434/v1
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-candidate
          path: dist
      - run: >-
          python -m pip install dist/*.whl "openai>=2.45,<3"
          "openai-agents>=0.18.3,<0.19" "langgraph>=0.2"
          "strands-agents>=1.29,<2" "mcp>=1,<2"
      - name: Install and start Ollama
        run: |
          test -n "$OLLAMA_MODEL" || { echo 'OLLAMA_MODEL must be configured'; exit 1; }
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve > /tmp/ollama.log 2>&1 &
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:11434/api/tags && break
            sleep 2
          done
          ollama pull "$OLLAMA_MODEL"
      - run: >-
          python scripts/run_live_matrix.py
          --wheel $(ls dist/*.whl)
          --output live-ollama-runtime.json
          --profile ollama
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: live-ollama-runtime
          path: live-ollama-runtime.json
          if-no-files-found: warn
