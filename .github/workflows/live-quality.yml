name: recorded-live-acceptance

# A fresh live campaign requires a separately authorized, persistent allocation.
# Do not run scheduled inference with repository secrets or reset the ledger.
# This workflow checks the preserved campaign; it does not repeat model calls.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-recorded-acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - run: python -m pip install 'pydantic>=2.7,<3'
      - name: Verify the final campaign against the reviewed artifacts
        run: |
          python scripts/prepare_release_213.py > recorded-acceptance.json
          cat recorded-acceptance.json
          echo 'Verified preserved live acceptance. No new inference was executed.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: recorded-live-acceptance
          path: recorded-acceptance.json
          if-no-files-found: error
