name: mutation-quality

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 5 * * 1"
  workflow_dispatch:

jobs:
  mutation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14.8"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,bedrock,langgraph,openai,openai-agents,strands]" "mutmut==3.8.1"
      - run: python -m pip install -e ./integrations/ada
      - name: Run mutation tests
        shell: bash
        run: |
          set -o pipefail
          python -c "import shutil; shutil.rmtree('mutants', ignore_errors=True)"
          mutmut run 2>&1 | tee mutation-run.log
          mutmut results > mutation-results.txt
          python scripts/check_mutation_gate.py --record-success
      - name: Enforce mutation result
        run: |
          mutmut results > mutation-results.txt
          cat mutation-results.txt
          python scripts/check_mutation_gate.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-results
          path: |
            mutation-results.txt
            mutation-run.log
            mutation-gate.json
            mutation-equivalents.json
          if-no-files-found: warn
