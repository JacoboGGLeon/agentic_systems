name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact package version to publish (for example 2.1.0)
        required: true
        type: string
      candidate_release_id:
        description: Numeric ID of the draft release containing the certified assets
        required: true
        type: string
      wheel_sha256:
        description: SHA256 of the already-certified wheel
        required: true
        type: string
      sdist_sha256:
        description: SHA256 of the already-certified source distribution
        required: true
        type: string
      ada_sha256:
        description: SHA256 of the already-certified ADA delivery
        required: true
        type: string
      studio_sha256:
        description: SHA256 of the mirrored Studio delivery
        required: true
        type: string
      skill_sha256:
        description: SHA256 of the Agentic Systems 2.1 skill
        required: true
        type: string
      certification_sha256:
        description: SHA256 of the final certification summary
        required: true
        type: string
      challenge_sha256:
        description: SHA256 of the focused MCP+A2A/LangGraph challenge
        required: true
        type: string
      confirm_publish:
        description: Publish the verified candidate to PyPI
        required: true
        default: false
        type: boolean

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  candidate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      wheel_filename: ${{ steps.identity.outputs.wheel_filename }}
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      EXPECTED_WHEEL_SHA256: ${{ inputs.wheel_sha256 }}
      EXPECTED_SDIST_SHA256: ${{ inputs.sdist_sha256 }}
      EXPECTED_ADA_SHA256: ${{ inputs.ada_sha256 }}
      EXPECTED_STUDIO_SHA256: ${{ inputs.studio_sha256 }}
      EXPECTED_SKILL_SHA256: ${{ inputs.skill_sha256 }}
      EXPECTED_CERTIFICATION_SHA256: ${{ inputs.certification_sha256 }}
      EXPECTED_CHALLENGE_SHA256: ${{ inputs.challenge_sha256 }}
      CANDIDATE_RELEASE_ID: ${{ inputs.candidate_release_id }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: v${{ inputs.version }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Download the immutable release candidate
        run: |
          mkdir candidate
          release_json="$(gh api \
            "/repos/${GITHUB_REPOSITORY}/releases/${CANDIDATE_RELEASE_ID}")"
          for name in \
            "agentic_systems-${RELEASE_VERSION}-py3-none-any.whl" \
            "agentic_systems-${RELEASE_VERSION}.tar.gz" \
            "agentic-systems-${RELEASE_VERSION}-ada-offline.zip" \
            "agentic-systems-studio-${RELEASE_VERSION}.zip" \
            "agentic-systems-skill-${RELEASE_VERSION}.zip" \
            "agentic-systems-${RELEASE_VERSION}-strands-protocol-challenge.zip" \
            "final-certification-summary.json" \
            "SHA256SUMS-${RELEASE_VERSION}.txt"; do
            asset_id="$(jq -r --arg name "$name" \
              '.assets[] | select(.name == $name) | .id' <<<"$release_json")"
            test -n "$asset_id"
            gh api "/repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}" \
              -H "Accept: application/octet-stream" > "candidate/$name"
          done
      - name: Verify external artifact identity
        run: |
          wheel="candidate/agentic_systems-${RELEASE_VERSION}-py3-none-any.whl"
          sdist="candidate/agentic_systems-${RELEASE_VERSION}.tar.gz"
          ada="candidate/agentic-systems-${RELEASE_VERSION}-ada-offline.zip"
          studio="candidate/agentic-systems-studio-${RELEASE_VERSION}.zip"
          skill="candidate/agentic-systems-skill-${RELEASE_VERSION}.zip"
          challenge="candidate/agentic-systems-${RELEASE_VERSION}-strands-protocol-challenge.zip"
          certification="candidate/final-certification-summary.json"
          test "$(sha256sum "$wheel" | cut -d' ' -f1)" = "$EXPECTED_WHEEL_SHA256"
          test "$(sha256sum "$sdist" | cut -d' ' -f1)" = "$EXPECTED_SDIST_SHA256"
          test "$(sha256sum "$ada" | cut -d' ' -f1)" = "$EXPECTED_ADA_SHA256"
          test "$(sha256sum "$studio" | cut -d' ' -f1)" = "$EXPECTED_STUDIO_SHA256"
          test "$(sha256sum "$skill" | cut -d' ' -f1)" = "$EXPECTED_SKILL_SHA256"
          test "$(sha256sum "$challenge" | cut -d' ' -f1)" = "$EXPECTED_CHALLENGE_SHA256"
          test "$(sha256sum "$certification" | cut -d' ' -f1)" = "$EXPECTED_CERTIFICATION_SHA256"
          (cd candidate && sha256sum -c "SHA256SUMS-${RELEASE_VERSION}.txt")
      - name: Verify ADA checksums and certification manifest
        run: |
          python -m zipfile -e \
            "candidate/agentic-systems-${RELEASE_VERSION}-ada-offline.zip" \
            candidate/ada
          bundle="candidate/ada/agentic-systems-${RELEASE_VERSION}-ada-offline"
          python "$bundle/verify_bundle.py"
          python - "$bundle/manifest.json" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          manifest = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          assert manifest["package_version"] == os.environ["RELEASE_VERSION"]
          assert manifest["wheel"]["sha256"] == os.environ["EXPECTED_WHEEL_SHA256"]
          assert manifest["credentials_included"] is False
          certification = manifest["certification"]
          assert certification["primary"] == "20/20"
          assert certification["semantic_episodes"] == "76/76"
          assert certification["bedrock_iam"] == "4/4"
          assert certification["no_fallback"] is True
          PY
      - name: Verify package metadata
        run: |
          python -m pip install --upgrade pip twine
          python -m twine check candidate/*.whl candidate/*.tar.gz
      - name: Record candidate identity
        id: identity
        run: >-
          echo "wheel_filename=agentic_systems-${RELEASE_VERSION}-py3-none-any.whl"
          >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: certified-release-candidate
          path: |
            candidate/*.whl
            candidate/*.tar.gz
            candidate/*.zip
            candidate/*.json
            candidate/SHA256SUMS-*.txt
          if-no-files-found: error

  wheel-smoke:
    needs: candidate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/download-artifact@v5
        with:
          name: certified-release-candidate
          path: candidate
      - run: python -m pip install "candidate/${{ needs.candidate.outputs.wheel_filename }}"
      - env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: >-
          python -c "import importlib.metadata as m; import agentic_systems as a;
          assert a.__version__ == m.version('agentic-systems') == '${RELEASE_VERSION}'"
      - run: agentic-systems version

  publish:
    if: ${{ inputs.confirm_publish }}
    needs: [candidate, wheel-smoke]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: certified-release-candidate
          path: candidate
      - run: |
          mkdir publish-dist
          cp candidate/*.whl candidate/*.tar.gz publish-dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: publish-dist
          attestations: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          draft: false
          generate_release_notes: true
          files: |
            candidate/*.whl
            candidate/*.tar.gz
            candidate/*.zip
            candidate/*.json
            candidate/SHA256SUMS-*.txt

  post-publish-smoke:
    if: ${{ inputs.confirm_publish }}
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: python -m pip install --no-cache-dir "agentic-systems==${{ inputs.version }}"
      - run: agentic-systems version
