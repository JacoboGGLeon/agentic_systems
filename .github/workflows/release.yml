name: release

on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: Successful release-candidate workflow run containing immutable artifacts
        required: true
        type: string
      manifest_sha256:
        description: SHA256 of the reviewed release-manifest.json
        required: true
        type: string
      index:
        description: Destination index
        type: choice
        options: [testpypi, pypi]
        default: testpypi
      confirm_publish:
        description: Publish if absent, or resume if every published hash already matches
        type: boolean
        default: false

concurrency:
  group: release-publication
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  candidate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.identity.outputs.version }}
      commit_sha: ${{ steps.identity.outputs.commit_sha }}
    env:
      GH_TOKEN: ${{ github.token }}
      CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
      MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
      - run: python -m pip install "pydantic>=2.7,<3"
      - name: Verify successful candidate run in this repository
        run: |
          [[ "$CANDIDATE_RUN_ID" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN_ID" > run.json
          jq -e '.conclusion == "success" and .event == "workflow_dispatch" and .head_branch == "main" and .path == ".github/workflows/release-candidate.yml"' run.json
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: certified-release-candidate
          path: candidate
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}
      - name: Verify all candidate bytes and run identity
        id: identity
        run: |
          python scripts/release_publication.py --manifest candidate/release-manifest.json --manifest-sha256 "$MANIFEST_SHA256" --directory candidate --verify-only
          test "$(jq -r .head_sha run.json)" = "$(jq -r .commit_sha candidate/release-manifest.json)"
      - name: Require successful quality workflow for the candidate commit
        run: |
          commit="$(jq -r .commit_sha candidate/release-manifest.json)"
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/quality.yml/runs?head_sha=$commit&status=success" | jq -e --arg commit "$commit" '.workflow_runs | any(.head_sha == $commit and .conclusion == "success")'
      - name: Validate package metadata
        run: |
          python -m pip install twine
          python -m twine check candidate/*.whl candidate/*.tar.gz
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: verified-release
          path: candidate/*
          if-no-files-found: error

  wheel-smoke:
    needs: candidate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: verified-release
          path: candidate
      - run: python -m pip install candidate/*.whl
      - env:
          EXPECTED_VERSION: ${{ needs.candidate.outputs.version }}
        run: |
          cd /tmp
          python -c "import os, importlib.metadata as m, agentic_systems as a; assert a.__version__ == m.version('agentic-systems') == os.environ['EXPECTED_VERSION']; assert len(a.__all__) == a.api_contract()['export_count']"
          agentic-systems version

  publish:
    if: ${{ inputs.confirm_publish }}
    needs: [candidate, wheel-smoke]
    runs-on: ubuntu-latest
    environment: ${{ inputs.index == 'testpypi' && 'testpypi' || 'pypi' }}
    permissions:
      id-token: write
      contents: read
    env:
      MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
      INDEX: ${{ inputs.index }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
      - run: python -m pip install "pydantic>=2.7,<3"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: verified-release
          path: candidate
      - name: Reconcile published distributions immediately before upload
        id: reconcile
        run: python scripts/release_publication.py --manifest candidate/release-manifest.json --manifest-sha256 "$MANIFEST_SHA256" --directory candidate --index "$INDEX"
      - if: steps.reconcile.outputs.decision == 'absent'
        run: |
          mkdir publish-dist
          cp candidate/*.whl candidate/*.tar.gz publish-dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        if: steps.reconcile.outputs.decision == 'absent'
        with:
          packages-dir: publish-dist
          repository-url: ${{ inputs.index == 'testpypi' && 'https://test.pypi.org/legacy/' || 'https://upload.pypi.org/legacy/' }}
          attestations: true
      - name: Verify complete published identity, including on a repeated run
        run: python scripts/release_publication.py --manifest candidate/release-manifest.json --manifest-sha256 "$MANIFEST_SHA256" --directory candidate --index "$INDEX" --require-present

  post-publish-smoke:
    needs: [candidate, publish]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]
    env:
      VERSION: ${{ needs.candidate.outputs.version }}
      INDEX: ${{ inputs.index }}
      MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: verified-release
          path: candidate
      - run: python -m pip install "pydantic>=2.7,<3"
      - name: Download exactly the published wheel and verify its bytes
        run: |
          index_url=https://pypi.org/simple
          if [ "$INDEX" = testpypi ]; then index_url=https://test.pypi.org/simple; fi
          python -m pip download --no-deps --no-cache-dir --only-binary=:all: --index-url "$index_url" --dest published "agentic-systems==$VERSION"
          python -c "import sys; from pathlib import Path; sys.path.insert(0,'scripts'); from release_publication import load_manifest,sha256; import os; m=load_manifest(Path('candidate/release-manifest.json'),os.environ['MANIFEST_SHA256']); a=next(a for a in m.artifacts if a.kind=='bdist_wheel'); assert sha256(Path('published')/a.filename)==a.sha256"
          python -m pip install published/*.whl
          cd /tmp
          python -c "import os, importlib.metadata as m, agentic_systems as a; assert a.__version__ == m.version('agentic-systems') == os.environ['VERSION']; assert len(a.__all__) == a.api_contract()['export_count']"
          agentic-systems version

  finalize:
    if: ${{ inputs.index == 'pypi' }}
    needs: [candidate, post-publish-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.candidate.outputs.version }}
      COMMIT: ${{ needs.candidate.outputs.commit_sha }}
      MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
      - run: python -m pip install "pydantic>=2.7,<3"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: verified-release
          path: candidate
      - name: Finalize without overwriting any existing release asset
        # The finalizer uses the same Pydantic manifest as every earlier gate.
        run: python scripts/finalize_release.py --directory candidate --manifest-sha256 "$MANIFEST_SHA256"
