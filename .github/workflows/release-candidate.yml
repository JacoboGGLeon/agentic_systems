name: release-candidate

on:
  workflow_dispatch:
    inputs:
      quality_run_id:
        description: Successful quality run for this exact main commit (all five Python jobs)
        required: true
        type: string
      acceptance_policy_sha256:
        description: Reviewed version-specific maintenance acceptance policy SHA256
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  seal:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      QUALITY_RUN_ID: ${{ inputs.quality_run_id }}
      POLICY_SHA256: ${{ inputs.acceptance_policy_sha256 }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - run: python -m pip install 'pydantic>=2.7,<3' twine
      - name: Require complete quality for the exact main commit
        run: |
          [[ "$QUALITY_RUN_ID" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$QUALITY_RUN_ID" > run.json
          jq -e --arg commit "$GITHUB_SHA" '.conclusion == "success" and .head_sha == $commit and .head_branch == "main" and .path == ".github/workflows/quality.yml"' run.json
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$QUALITY_RUN_ID/jobs?per_page=100" --jq '.jobs[] | {name,conclusion}' | jq -s -e '([.[] | select(.name | startswith("offline ("))] | length == 5) and all(.[]; .conclusion == "success")'
      - name: Require successful mutation gate for the exact main commit
        id: mutation
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/mutation.yml/runs?head_sha=$GITHUB_SHA&status=success" > mutation-runs.json
          run_id="$(jq -r --arg commit "$GITHUB_SHA" '[.workflow_runs[] | select(.head_sha == $commit and .head_branch == "main" and .conclusion == "success")][0].id // empty' mutation-runs.json)"
          [[ "$run_id" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?per_page=100" | jq -e '(.jobs | length > 0) and all(.jobs[]; .conclusion == "success")'
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: mutation-results
          path: mutation-bytes
          run-id: ${{ steps.mutation.outputs.run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: current-candidate-bytes
          path: quality-bytes
          run-id: ${{ inputs.quality_run_id }}
          github-token: ${{ github.token }}
      - name: Verify reviewed policy and seal quality-built bytes without rebuilding
        run: |
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          policy="release/policy-$version.json"
          echo "$POLICY_SHA256  $policy" | sha256sum --check
          python scripts/seal_release.py --quality quality-bytes --mutation mutation-bytes --policy "$policy" --output candidate
      - name: Verify immutable manifest and package metadata
        run: |
          manifest_sha="$(sha256sum candidate/release-manifest.json | cut -d' ' -f1)"
          python scripts/release_publication.py --manifest candidate/release-manifest.json --manifest-sha256 "$manifest_sha" --directory candidate --verify-only
          python -m twine check --strict candidate/*.whl candidate/*.tar.gz
          echo "Manifest SHA256: $manifest_sha" >> "$GITHUB_STEP_SUMMARY"
          echo "Nothing was published; review the artifact before dispatching release.yml." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: certified-release-candidate
          path: candidate/*
          if-no-files-found: error
          retention-days: 90
