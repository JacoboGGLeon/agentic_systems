name: quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14'
      - run: python -m pip install 'setuptools>=69' wheel twine
      - run: python scripts/build_candidate.py .tmp/current
      - name: Build optional applications
        run: python -m pip wheel --no-deps --no-build-isolation --no-index --wheel-dir .tmp/current/dist ./examples/agentic_systems_studio ./integrations/ada
      - run: python -m twine check --strict .tmp/current/dist/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: current-candidate-bytes
          path: |
            .tmp/current/dist/
            .tmp/current/manifest.json
          if-no-files-found: error

  offline:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      LANGCHAIN_TRACING_V2: 'false'
      LANGSMITH_TRACING: 'false'
      OTEL_SDK_DISABLED: 'true'
      OPENAI_AGENTS_DISABLE_TRACING: '1'
      AWS_EC2_METADATA_DISABLED: 'true'
      AGENTIC_VALIDATION_EVIDENCE: .tmp/current-evidence
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: current-candidate-bytes
          path: .tmp/current
      - name: Install the shared SDK and application wheels
        run: |
          python scripts/install_candidate.py .tmp/current/dist
          python -m pip install 'streamlit>=1.37'
          mkdir -p .tmp/current-evidence
          echo "EXPECTED_VERSION=$(python -c 'import agentic_systems as t; print(t.__version__)')" >> "$GITHUB_ENV"
          echo "AGENTIC_TEST_VERSION=$(python -c 'import agentic_systems as t; print(t.__version__)')" >> "$GITHUB_ENV"
          echo "AGENTIC_VALIDATION_SITE=$(python -c 'import agentic_systems as t; from pathlib import Path; print(Path(t.__file__).parent.parent)')" >> "$GITHUB_ENV"
      - name: Lint current surfaces
        run: |
          python -m ruff check src/agentic_systems tests/v214_graph tests/grammar214 tests/learning214 tests/current integrations/ada/src scripts/build_candidate.py scripts/install_candidate.py scripts/verify_candidate.py scripts/smoke_release.py scripts/check_catalog.py scripts/test_offline_214.py
          python -m ruff check tutorials examples --select F821
      - run: python scripts/check_secrets.py
      - run: python scripts/check_catalog.py
      - name: Type-check current schema and normalization contracts strictly
        run: python -m pyright
      - run: lint-imports
      - name: Run canonical source contracts
        run: python scripts/test_offline_214.py --source --junitxml=.tmp/current-evidence/source-tests.xml
      - name: Run the same contracts against the installed wheel
        run: python scripts/test_offline_214.py -p pytest_cov --cov=agentic_systems --cov-report=term-missing --cov-report=json:.tmp/current-evidence/coverage.json --junitxml=.tmp/current-evidence/installed-tests.xml
      - name: Verify source, installed bytes and RECORD
        run: |
          wheel=$(find .tmp/current/dist -maxdepth 1 -name 'agentic_systems-*.whl' -print -quit)
          python scripts/verify_candidate.py "$wheel" > .tmp/current-evidence/integrity.json
      - name: Smoke installed SDK outside checkout
        run: |
          cd "$RUNNER_TEMP"
          python "$GITHUB_WORKSPACE/scripts/smoke_release.py"
          agentic-systems version
          agentic-systems api
          agentic-systems doctor
          agentic-systems-ada doctor
      - name: Execute examples and all notebooks offline
        run: |
          python scripts/validate_learning_offline_214.py
          python scripts/validate_learning_notebooks_214.py --profile offline
          python scripts/validate_scaffold.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: offline-python-${{ matrix.python-version }}
          path: .tmp/current-evidence/
          if-no-files-found: error
