name: quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      LANGCHAIN_TRACING_V2: 'false'
      LANGSMITH_TRACING: 'false'
      OTEL_SDK_DISABLED: 'true'
      OPENAI_AGENTS_DISABLE_TRACING: '1'
      AWS_EC2_METADATA_DISABLED: 'true'
      AGENTIC_213_EVIDENCE_DIR: .tmp/ci-213-evidence
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install development dependencies
        run: >-
          python -m pip install '.[dev,bedrock,langgraph,openai,openai-agents,strands]'
          'setuptools>=69' wheel 'streamlit>=1.37'
      - name: Lint current API and examples
        run: >-
          python -m ruff check src/agentic_systems tests/v213
          scripts/build_candidate_213.py scripts/test_offline_213.py
          scripts/execute_tutorials_213.py scripts/inventory_current_213.py
          scripts/validate_candidate_213.py scripts/write_tutorials_213.py
          scripts/migrate_examples_213.py scripts/finalize_examples_213.py
          scripts/validate_examples_213.py examples/catalog_tools.py
          scripts/write_api_walkthrough_213.py scripts/execute_notebooks_213.py
          scripts/inventory_notebooks_213.py scripts/unify_teaching_imports_213.py
          scripts/start_final_campaign_213.py examples/api_walkthrough
          scripts/capture_runresults_213.py scripts/report_runresults_213.py
          scripts/prepare_release_213.py tests/release213
          examples/agentic_systems_studio/src examples/agentic_systems_studio/tests
          examples/framework_interop examples/grammar_tour tutorials/lesson_examples.py
          examples/run_offline_213.py examples/tool_contracts examples/flow_semantics
          examples/execution_lifecycle examples/results_lineage examples/episode_memory
          examples/evaluation_checks examples/provider_framework_conformance
          examples/model_serving examples/package_install examples/agent_contracts
          examples/portable_skills examples/order_fulfillment
      - name: Scan repository for credential material
        run: python scripts/check_secrets.py
      - name: Verify unchanged SDK, Studio, notebooks and final live acceptance
        run: |
          mkdir -p .tmp/ci-213-evidence
          python scripts/prepare_release_213.py | tee .tmp/ci-213-evidence/reviewed-integrity.json
      - name: Test release integrity and publication conflict handling
        run: >-
          python -m pytest tests/release213 tests/release/test_release_publication.py
          tests/release/test_release_finalization.py -q -o pythonpath=scripts
          --junitxml=.tmp/ci-213-evidence/release-tests.xml
      - name: Build a clean candidate without an index
        run: python scripts/build_candidate_213.py .tmp/ci-213
      - name: Install the reviewed artifact used by the final live campaign
        run: >-
          python -m pip install --no-index --no-deps --force-reinstall
          revisions/2.1.3/closeout-artifacts/agentic_systems-2.1.3-py3-none-any.whl
      - name: Install Studio without editable mode
        run: python -m pip install --no-deps --no-build-isolation ./examples/agentic_systems_studio
      - name: Architecture boundaries
        run: lint-imports
      - name: Offline installed-wheel contracts
        run: >-
          python scripts/test_offline_213.py -p pytest_cov --cov=agentic_systems
          --cov-config=.coveragerc-213 --cov-report=term-missing
          --cov-report=json:.tmp/ci-213-evidence/coverage.json
          --junitxml=.tmp/ci-213-evidence/tests.xml
      - name: Execute every current tutorial and example notebook in fresh kernels
        run: python scripts/execute_notebooks_213.py
      - name: Execute canonical examples
        run: python examples/run_offline_213.py
      - name: Execute the 34 historical adaptations without inference
        run: python scripts/validate_examples_213.py
      - name: Test Studio and its actual widgets offline
        run: >-
          python examples/agentic_systems_studio/test_offline.py
          --junitxml=.tmp/ci-213-evidence/studio-tests.xml
      - name: Test business evidence projection and failure preservation
        run: >-
          python -m pytest examples/api_walkthrough/tests -q -o pythonpath=.
          --junitxml=.tmp/ci-213-evidence/business-boundary-tests.xml
      - name: Execute order application
        run: |
          python examples/order_fulfillment/run.py
          cp examples/order_fulfillment/evidence/run.json .tmp/ci-213-evidence/order.json
      - name: Verify artifact contents and the generated project
        run: >-
          python scripts/validate_candidate_213.py --wheel
          revisions/2.1.3/closeout-artifacts/agentic_systems-2.1.3-py3-none-any.whl
      - name: Catalog consistency
        run: python examples/catalog_tools.py --check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: offline-213-python-${{ matrix.python-version }}
          path: |
            .tmp/ci-213/manifest.json
            .tmp/ci-213/dist/*
            .tmp/ci-213-evidence/
            examples/**/evidence/*.json
            !examples/history/**
            !examples/**/evidence/previous/**
          if-no-files-found: error

  release-dry-run:
    needs: offline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - run: python -m pip install 'pydantic>=2.7,<3' twine
      - name: Prepare reviewed delivery without rebuilding or publishing
        run: python scripts/prepare_release_213.py --output .tmp/release-preview
      - name: Verify hashes and publication metadata
        run: |
          manifest_sha="$(sha256sum .tmp/release-preview/release-manifest.json | cut -d' ' -f1)"
          python scripts/release_publication.py --manifest .tmp/release-preview/release-manifest.json --manifest-sha256 "$manifest_sha" --directory .tmp/release-preview --verify-only
          python scripts/build_release_manifest.py --directory .tmp/release-preview
          python -m twine check --strict .tmp/release-preview/*.whl .tmp/release-preview/*.tar.gz
          echo "Publication dry run passed; no index upload, release or tag was created." >> "$GITHUB_STEP_SUMMARY"
          echo "Reviewed manifest SHA256: $manifest_sha" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: reviewed-213-publication-preview
          path: .tmp/release-preview/*
          if-no-files-found: error
