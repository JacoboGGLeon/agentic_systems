[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-systems"
version = "1.1.0"
description = "Agentic Systems: a computational grammar for building, executing, observing, and evaluating intelligent systems."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Jacobo Gerardo Gonzalez Leon", email = "jacobogerardo.gonzalez@bbva.com"}]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
]
dependencies = [
    "pydantic>=2.7.0",
    "pandas>=2.0.0",
    "typing-extensions>=4.10.0",
    "rich>=13.0.0",
]


[project.urls]
Homepage = "https://www.github.com/JacoboGGLeon/agentic_systems"
Repository = "https://www.github.com/JacoboGGLeon/agentic_systems"
LinkedIn = "https://www.linkedin.com/in/jacoboggleon/"

[project.optional-dependencies]
bedrock = ["boto3>=1.34.0", "botocore>=1.34.0"]
langgraph = ["langgraph>=0.2.0", "typing-extensions>=4.10.0"]
openai = ["openai>=1.0.0"]
vllm = ["vllm>=0.9.0", "openai>=1.0.0"]
vll = ["vllm>=0.9.0", "openai>=1.0.0"]
tutorials = ["ipykernel>=6.0.0", "jupyterlab>=4.0.0", "pandas>=2.0.0", "rich>=13.0.0"]
dev = ["pytest>=8.0.0", "pytest-cov>=5.0.0", "ruff>=0.6.1"]
all = [
    "boto3>=1.34.0",
    "botocore>=1.34.0",
    "langgraph>=0.2.0",
    "openai>=1.0.0",
    "vllm>=0.9.0",
    "ipykernel>=6.0.0",
    "jupyterlab>=4.0.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.1",
]

[project.scripts]
agentic-systems = "agentic_systems.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["agentic_systems*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
cache_dir = ".tmp/pytest_cache"


[tool.coverage.run]
source = ["src/agentic_systems"]
omit = [
    "src/agentic_systems/providers/bedrock_runtime.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 100
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "\\.\\.\\.",
]
