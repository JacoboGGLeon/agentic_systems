[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-systems"
version = "2.0.0a1"
description = "Agentic Systems: a computational grammar for building, executing, observing, and evaluating intelligent systems."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Jacobo Gerardo Gonzalez Leon", email = "jacobogerardo.gonzalez@bbva.com"}]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
]
dependencies = [
    "pydantic>=2.7.0",
    "pandas>=2.0.0",
    "typing-extensions>=4.10.0",
    "rich>=13.0.0",
]


[project.urls]
Homepage = "https://www.github.com/JacoboGGLeon/agentic_systems"
Repository = "https://www.github.com/JacoboGGLeon/agentic_systems"
LinkedIn = "https://www.linkedin.com/in/jacoboggleon/"

[project.optional-dependencies]
bedrock = ["boto3>=1.39.0", "botocore>=1.39.0"]
langgraph = ["langgraph>=0.2.0", "typing-extensions>=4.10.0"]
openai = ["openai>=2.45.0,<3"]
openai-agents = ["openai-agents>=0.18.3,<0.19"]
strands = ["strands-agents>=1.29.0,<2", "mcp>=1,<2"]
vllm = ["vllm>=0.9.0", "openai>=2.45.0,<3"]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff==0.15.22",
    "tomli>=2.0.1; python_version < '3.11'",
    "ipykernel>=6.0.0",
    "jupyterlab>=4.0.0",
    "nbclient>=0.10.0",
    "nbformat>=5.10.0",
]
all = [
    "boto3>=1.39.0",
    "botocore>=1.39.0",
    "langgraph>=0.2.0",
    "openai>=2.45.0,<3",
    "openai-agents>=0.18.3,<0.19",
    "strands-agents>=1.29.0,<2",
    "mcp>=1,<2",
    "vllm>=0.9.0",
    "ipykernel>=6.0.0",
    "jupyterlab>=4.0.0",
    "nbclient>=0.10.0",
    "nbformat>=5.10.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff==0.15.22",
    "tomli>=2.0.1; python_version < '3.11'",
]

[project.scripts]
agentic-systems = "agentic_systems.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["agentic_systems*"]

[tool.pytest.ini_options]
filterwarnings = [
    "ignore:'asyncio.get_event_loop_policy' is deprecated and slated for removal in Python 3.16:DeprecationWarning:agents\\.run",
]
pythonpath = ["src"]
testpaths = ["tests"]
cache_dir = ".tmp/pytest_cache"

[tool.ruff]

[tool.ruff.lint.per-file-ignores]
"src/agentic_systems/__init__.py" = ["F401"]


[tool.coverage.run]
source = ["src/agentic_systems"]
omit = [
    "src/agentic_systems/providers/bedrock_runtime.py",
    "src/agentic_systems/providers/bedrock/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 100
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "\\.\\.\\.",
]
