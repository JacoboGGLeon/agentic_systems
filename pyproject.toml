[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-systems"
version = "1.0.0"
description = "Agentic Systems: auditable agentic systems with tools across Bedrock Runtime, LangGraph and OpenAI Agents SDK."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Jacobo Gerardo González León", email = "jacobogerardo.gonzalez@bbva.com"}]
dependencies = [
    "pydantic>=2.7.0",
    "pandas>=2.0.0",
    "typing-extensions>=4.10.0",
    "rich>=13.0.0",
]


[project.urls]
Homepage = "https://www.github.com/JacoboGGLeon/agentic_systems"
Repository = "https://www.github.com/JacoboGGLeon/agentic_systems"
LinkedIn = "https://www.linkedin.com/in/jacoboggleon/"

[project.optional-dependencies]
bedrock = ["boto3>=1.34.0", "botocore>=1.34.0"]
athena = ["boto3>=1.34.0", "botocore>=1.34.0", "awswrangler>=3.0.0"]
langgraph = ["langgraph>=0.2.0", "typing-extensions>=4.10.0"]
openai = ["openai>=1.0.0"]
tutorials = ["ipykernel>=6.0.0", "jupyterlab>=4.0.0", "pandas>=2.0.0", "rich>=13.0.0"]
dev = ["pytest>=8.0.0", "pytest-cov>=5.0.0", "ruff>=0.6.1"]
all = [
    "boto3>=1.34.0",
    "botocore>=1.34.0",
    "awswrangler>=3.0.0",
    "langgraph>=0.2.0",
    "openai>=1.0.0",
    "ipykernel>=6.0.0",
    "jupyterlab>=4.0.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.1",
]

[project.scripts]
agentic-systems = "agentic_systems.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["agentic_systems*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]


[tool.coverage.run]
source = ["src/agentic_systems"]
omit = [
    "src/agentic_systems/providers/bedrock_runtime.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 100
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "\\.\\.\\.",
]
