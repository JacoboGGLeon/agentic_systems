[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-systems-api-revision-challenge"
version = "2.1.3"
description = "Offline reference project for the Agentic Systems 2.1.3 API revision candidate"
requires-python = ">=3.10"
dependencies = ["agentic-systems==2.1.2", "langgraph==1.2.16"]

[project.optional-dependencies]
test = ["pytest==9.1.1"]
notebook = ["nbformat>=5.10,<6", "nbclient>=0.11,<1", "ipykernel>=7,<8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
order_challenge = ["fixtures/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
