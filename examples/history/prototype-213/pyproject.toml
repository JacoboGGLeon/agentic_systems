[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-systems-unified-grammar-prototype"
version = "2.1.3"
description = "Offline API revision candidate over the unchanged 2.1.2 SDK, not a library release"
requires-python = ">=3.10"
dependencies = ["agentic-systems==2.1.2", "langgraph==1.2.16"]

[project.optional-dependencies]
test = ["pytest==9.1.1"]
notebook = ["nbformat>=5.10,<6", "nbclient>=0.11,<1", "ipykernel>=7,<8"]

[tool.setuptools]
packages = ["unified_grammar"]
package-dir = {unified_grammar = "."}
