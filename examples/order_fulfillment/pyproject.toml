[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-order-example"
version = "2.1.4.dev3"
requires-python = ">=3.10"
dependencies = ["agentic-systems==2.1.4.dev3"]

[tool.setuptools]
packages = ["order_fulfillment"]
package-dir = {order_fulfillment = "."}

[tool.setuptools.package-data]
order_fulfillment = ["fixtures/*.json"]
