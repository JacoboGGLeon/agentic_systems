[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-systems-studio"
version = "2.1.3"
description = "Provider/framework-agnostic conversational reference for Agentic Systems 2.1"
requires-python = ">=3.10"
dependencies = [
  "agentic-systems==2.1.3",
  "rich>=13.7",
]

[project.optional-dependencies]
ui = ["streamlit>=1.37"]
frameworks = ["agentic-systems[bedrock,openai,langgraph,openai-agents,strands]==2.1.3"]
notebook = [
  "ipython>=8.0",
  "ipywidgets>=8.1",
  "nbclient>=0.10",
  "nbconvert>=7.16",
  "jupyter-server-proxy>=4.4",
]
test = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]
