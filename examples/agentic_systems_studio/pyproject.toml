[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "agentic-systems-studio"
version = "0.1.0"
description = "Portable component studio and reference scaffolder for Agentic Systems 2.0"
requires-python = ">=3.10"
dependencies = [
  "agentic-systems==2.0.0",
  "rich>=13.7",
]

[project.optional-dependencies]
ui = ["streamlit>=1.37"]
notebook = ["ipython>=8.0", "nbclient>=0.10", "jupyter-server-proxy>=4.4"]
test = ["pytest>=8.0"]

[project.scripts]
agentic-studio = "agentic_systems_studio.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_systems_studio"]
